rules:
- api_name: todo_stale
  kind: age_fact
  description: An open Todo that has sat for two weeks is stale and shows up in the
    briefing.
  source_type: Todo
  confidence: 0.9
  when_property:
    api_name: status
    equals: open
  when_age:
    property: recorded_at
    older_than_days: 14
  then_fact:
    predicate: stale
    value: 'true'
- api_name: question_stale
  kind: age_fact
  description: An OpenQuestion nobody answered in two weeks is stale and needs a decision
    or a close.
  source_type: OpenQuestion
  confidence: 0.9
  when_property:
    api_name: status
    equals: open
  when_age:
    property: recorded_at
    older_than_days: 14
  then_fact:
    predicate: stale
    value: 'true'
- api_name: memory_aging
  kind: age_fact
  description: A Memory older than ninety days should be re-confirmed before an agent
    leans on it.
  source_type: Memory
  confidence: 0.85
  when_age:
    property: recorded_at
    older_than_days: 90
  then_fact:
    predicate: reconfirm
    value: 'true'
- api_name: synth_property_Topic_status_active
  kind: property_fact
  description: Observed status=active on Topic.
  source_type: Topic
  confidence: 0.9
  when_property:
    api_name: status
    equals: active
  when_links: []
  then_fact:
    predicate: status
    value: active
- api_name: synth_join_Conversation
  kind: join_links
  description: Conversation with topic, facts is a complete story.
  source_type: Conversation
  confidence: 0.9
  when_links:
  - topic
  - facts
  then_fact:
    predicate: story
    value: complete
- api_name: synth_prefix_Fact_sem_4375_fact_in_topic
  kind: prefix_link
  description: Fact ids starting sem-4375 share fact_in_topic Topic:quinovo.
  source_type: Fact
  confidence: 0.9
  when_links: []
  when_pk_prefix: sem-4375
  then_link:
    link_type: fact_in_topic
    to_type: Topic
    to_id: quinovo
- api_name: synth_prefix_Fact_sem_47be_fact_in_topic
  kind: prefix_link
  description: Fact ids starting sem-47be share fact_in_topic Topic:quinovo.
  source_type: Fact
  confidence: 0.9
  when_links: []
  when_pk_prefix: sem-47be
  then_link:
    link_type: fact_in_topic
    to_type: Topic
    to_id: quinovo
