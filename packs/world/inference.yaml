rules:
- api_name: mark_conversation_captured
  kind: property_fact
  description: A Conversation with a recorded_at is captured.
  source_type: Conversation
  confidence: 0.95
  when_property:
    api_name: recorded_at
    equals: ''
  then_fact:
    predicate: captured
    value: 'true'
- api_name: todo_is_scoped
  kind: property_fact
  description: An open Todo is scoped (ready to be worked).
  source_type: Todo
  confidence: 0.9
  when_property:
    api_name: status
    equals: open
  then_fact:
    predicate: scoped
    value: 'true'
- api_name: decision_is_canonical
  kind: property_fact
  description: A Decision with recorded_at set is canonical.
  source_type: Decision
  confidence: 0.95
  when_property:
    api_name: recorded_at
    equals: ''
  then_fact:
    predicate: canonical
    value: 'true'
- api_name: fact_is_topic_fact
  kind: fact_link_fact
  description: A Fact that is filed under a Topic is a topic fact.
  source_type: Fact
  confidence: 0.9
  when_fact:
    predicate: ''
    equals: ''
  when_link: topic
  then_fact:
    predicate: topic_fact
    value: 'true'
- api_name: synth_property_topic_status_active
  kind: property_fact
  description: Observed status=active on Topic.
  source_type: Topic
  confidence: 0.9
  when_property:
    api_name: status
    equals: active
  when_links: []
  then_fact:
    predicate: status
    value: active
- api_name: synth_join_Conversation
  kind: join_links
  description: Conversation with topic, facts is a complete story.
  source_type: Conversation
  confidence: 0.9
  when_links:
  - topic
  - facts
  then_fact:
    predicate: story
    value: complete
- api_name: synth_recommend_mark_todo_captured_topic
  kind: fact_link_fact
  description: If Todo is at_risk and has topic, recommend mark_todo_captured.
  source_type: Todo
  confidence: 0.9
  when_fact:
    predicate: at_risk
    equals: 'true'
  when_link: topic
  when_links: []
  then_fact:
    predicate: recommended_action
    value: mark_todo_captured
- api_name: synth_recommend_mark_todo_shipped_topic
  kind: fact_link_fact
  description: If Todo is at_risk and has topic, recommend mark_todo_shipped.
  source_type: Todo
  confidence: 0.9
  when_fact:
    predicate: at_risk
    equals: 'true'
  when_link: topic
  when_links: []
  then_fact:
    predicate: recommended_action
    value: mark_todo_shipped
- api_name: synth_property_OpenQuestion_status_open
  kind: property_fact
  description: Observed status=open on OpenQuestion.
  source_type: OpenQuestion
  confidence: 0.9
  when_property:
    api_name: status
    equals: open
  when_links: []
  then_fact:
    predicate: status
    value: open
- api_name: synth_recommend_mark_question_answered_topic
  kind: fact_link_fact
  description: If OpenQuestion is at_risk and has topic, recommend mark_question_answered.
  source_type: OpenQuestion
  confidence: 0.9
  when_fact:
    predicate: at_risk
    equals: 'true'
  when_link: topic
  when_links: []
  then_fact:
    predicate: recommended_action
    value: mark_question_answered
