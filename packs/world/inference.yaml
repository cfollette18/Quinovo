rules:
- api_name: todo_stale
  kind: age_fact
  description: An open Todo that has sat for two weeks is stale and shows up in the
    briefing.
  source_type: Todo
  confidence: 0.9
  when_property:
    api_name: status
    equals: open
  when_age:
    property: recorded_at
    older_than_days: 14
  then_fact:
    predicate: stale
    value: 'true'
- api_name: question_stale
  kind: age_fact
  description: An OpenQuestion nobody answered in two weeks is stale and needs a decision
    or a close.
  source_type: OpenQuestion
  confidence: 0.9
  when_property:
    api_name: status
    equals: open
  when_age:
    property: recorded_at
    older_than_days: 14
  then_fact:
    predicate: stale
    value: 'true'
- api_name: memory_aging
  kind: age_fact
  description: A Memory older than ninety days should be re-confirmed before an agent
    leans on it.
  source_type: Memory
  confidence: 0.85
  when_age:
    property: recorded_at
    older_than_days: 90
  then_fact:
    predicate: reconfirm
    value: 'true'
