action_types:
- api_name: mark_todo_captured
  description: Stamp a Todo with status=captured.
  unattended: true
  parameters:
  - api_name: todo
    type: object
    object_type: Todo
  edits:
  - parameter: todo
    set:
      status: captured
- api_name: mark_todo_shipped
  description: Stamp a Todo as shipped.
  unattended: true
  parameters:
  - api_name: todo
    type: object
    object_type: Todo
  edits:
  - parameter: todo
    set:
      status: shipped
- api_name: mark_question_answered
  description: Stamp an OpenQuestion as answered.
  unattended: true
  parameters:
  - api_name: question
    type: object
    object_type: OpenQuestion
  edits:
  - parameter: question
    set:
      status: answered
- api_name: archive_topic
  description: Mark a Topic as archived. Gated; only fires on explicit apply_action.
  unattended: false
  parameters:
  - api_name: topic
    type: object
    object_type: Topic
  edits:
  - parameter: topic
    set:
      status: archived
