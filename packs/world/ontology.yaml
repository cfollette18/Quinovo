ontology:
  api_name: world
  display_name: Conversational world
  description: 'A typed model of the agent''s working memory. Topics anchor everything;
    Conversations, Facts, Memories, Todos, Skills, Decisions, and OpenQuestions hang
    off Topics through in_topic links. Entities are the nouns (people, systems,
    tools, projects, concepts) and Facts are triples about them: subject, predicate,
    value, with typed links to the subject and object Entity so the graph is
    traversable. Designed for autonomous capture: the agent writes structured
    objects at the end of every turn, the loop extracts entities and triples from
    raw turns, typed inference flags stale work, and unattended actions handle the
    rest.

    '
shared_properties:
- api_name: confidence
  type: number
  description: "0.0\u20131.0. Captures the agent's or the rule's confidence in the\
    \ fact. Facts at < 0.80 stay pending in Quinovo and require human approval (HITL).\
    \ Facts at >= 0.90 auto-assert and may trigger unattended actions.\n"
- api_name: recorded_at
  type: string
  description: ISO 8601 UTC timestamp for when the object was created.
interfaces:
- api_name: BelongsToTopic
  description: Anything that hangs off a Topic through an in_topic link.
  properties: []
- api_name: TimeStamped
  description: Anything that carries a recorded_at timestamp.
  properties:
  - recorded_at
object_types:
- api_name: Topic
  primary_key: id
  title_property: name
  description: "A basket of similar objects the agent groups together. Examples: quinovo,\
    \ cretex, jig, orzo. Subtopics nest inside (fruit \u2192 tropical fruit, or cretex\
    \ \u2192 MCP servers). Everything else hangs off a Topic through in_topic.\n"
  properties:
  - api_name: id
    type: string
    description: slug, lowercase, no spaces (e.g. cretex, quinovo)
  - api_name: name
    type: string
    description: human-readable label
  - api_name: description
    type: string
    required: false
  - api_name: status
    type: string
    required: false
    description: active, dormant, or archived
- api_name: Conversation
  primary_key: id
  title_property: summary
  implements:
  - BelongsToTopic
  - TimeStamped
  description: A single agent turn or a coherent exchange.
  properties:
  - api_name: id
    type: string
    description: session_id:turn_index, globally unique per turn
  - api_name: session_id
    type: string
  - api_name: turn_index
    type: number
  - api_name: summary
    type: string
    description: one-paragraph digest of the turn
  - api_name: recorded_at
    type: string
    description: ISO 8601 UTC timestamp
  - api_name: role
    type: string
    required: false
    description: free-form tag (planning, design, debug, ship, transcript, observed)
  - api_name: enriched
    type: string
    required: false
    description: extractor version that already turned this turn into entities and facts
- api_name: Entity
  primary_key: id
  title_property: name
  implements:
  - TimeStamped
  description: A noun the world keeps talking about - a person, organization, system,
    tool, project, place, or concept. Facts hang off Entities as subject and object,
    so asking about an Entity walks the graph.
  properties:
  - api_name: id
    type: string
    description: slug, lowercase, no spaces (e.g. langfuse, epicor, cfollette18)
  - api_name: name
    type: string
    description: canonical display name
  - api_name: kind
    type: string
    description: person, organization, system, tool, project, place, or concept
  - api_name: description
    type: string
    required: false
    description: one sentence saying what this is
  - api_name: aliases
    type: string
    required: false
    description: other names for the same thing, separated by " | "
  - api_name: recorded_at
    type: string
    required: false
- api_name: Fact
  primary_key: id
  title_property: predicate
  implements:
  - BelongsToTopic
  - TimeStamped
  description: A single structured claim as a triple - subject, predicate, value. The
    most atomic unit of knowledge. Subject and object Entities are linked when known.
  properties:
  - api_name: id
    type: string
  - api_name: subject
    type: string
    required: false
    description: what the claim is about, as the Entity name (e.g. Langfuse)
  - api_name: predicate
    type: string
    description: short verb-like label (e.g. uses, runs_on, decided, blocked_on)
  - api_name: value
    type: string
    description: the object of the claim - an Entity name or a short literal
  - api_name: confidence
    type: number
  - api_name: recorded_at
    type: string
- api_name: Memory
  primary_key: id
  title_property: text
  implements:
  - BelongsToTopic
  - TimeStamped
  description: A durable, cross-session fact about the user, environment, or agent.
