objects:
  Person:
    - id: cfollette
      name: Operator
  Device:
    - id: nheater
      hostname: heater
      os: linux
      presence: online
      class: lab
      status: open
    - id: nxtal
      hostname: xtal
      os: linux
      presence: online
      class: workstation
      status: open
    - id: planned:pi5
      hostname: pi5
      os: linux
      presence: not_on_tailnet
      class: lab
      status: open
  Service:
    - id: qwen35-server
      name: qwen35-server
      bind: 127.0.0.1:8082
      status: open
  Alert:
    - id: alert-heater-expose
      reason: portal on 0.0.0.0:8090
      status: open

links:
  hosts:
    - from: nheater
      to: qwen35-server
  alerts_on:
    - from: alert-heater-expose
      to: nheater
