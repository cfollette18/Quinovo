[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "quinovo"
version = "0.1.0"
description = "Operational ontology as an MCP server: typed objects, inference, governed actions."
readme = "README.md"
license = {text = "Apache-2.0"}
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "mcp>=1.8,<2",
  "pydantic>=2.9",
  "python-multipart>=0.0.9",
  "pyyaml>=6.0",
  "uvicorn[standard]>=0.32",
]

[project.optional-dependencies]
dev = [
  "httpx>=0.27",
  "pytest>=8.3",
]

[project.scripts]
quinovo = "quinovo.cli:main"

[tool.hatch.build.targets.wheel]
only-include = ["quinovo"]

[tool.hatch.build.targets.wheel.sources]
"src" = ""

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
