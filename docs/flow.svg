<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 640" role="img" aria-labelledby="title desc">
  <title id="title">Objects, links, inference, action</title>
  <desc id="desc">A package object linked to a person and a shipper. Inference marks it at risk and recommends notify_buyer. The write is apply_action.</desc>
  <rect width="1200" height="640" fill="#0B2026"/>
  <rect x="48" y="24" width="18" height="7" fill="#FF3621"/>
  <rect x="54" y="33.5" width="18" height="7" fill="#FF3621"/>
  <rect x="48" y="43" width="18" height="7" fill="#FF3621"/>
  <text x="78" y="46" fill="#F9F7F4" font-family="DM Sans, Helvetica Neue, Arial, sans-serif" font-size="18" font-weight="500">quinovo</text>
  <text x="60" y="88" fill="#F9F7F4" font-family="DM Sans, Helvetica Neue, Arial, sans-serif" font-size="26" font-weight="500">From a typed graph to a governed write</text>
  <text x="60" y="116" fill="#90A5B1" font-family="DM Sans, Helvetica Neue, Arial, sans-serif" font-size="15">Teaching pack: a box, a buyer, a shipper. The engine does not care about the nouns.</text>

  <g>
    <rect x="80" y="168" width="200" height="88" fill="#F9F7F4"/>
    <rect x="80" y="168" width="6" height="88" fill="#FF3621"/>
    <text x="186" y="202" text-anchor="middle" fill="#90A5B1" font-family="DM Sans, Helvetica Neue, Arial, sans-serif" font-size="12">Package</text>
    <text x="186" y="228" text-anchor="middle" fill="#1B3139" font-family="DM Sans, Helvetica Neue, Arial, sans-serif" font-size="18" font-weight="500">1Z999</text>

    <rect x="500" y="128" width="200" height="88" fill="#F9F7F4"/>
    <rect x="500" y="128" width="6" height="88" fill="#2272B4"/>
    <text x="606" y="162" text-anchor="middle" fill="#90A5B1" font-family="DM Sans, Helvetica Neue, Arial, sans-serif" font-size="12">Person</text>
    <text x="606" y="188" text-anchor="middle" fill="#1B3139" font-family="DM Sans, Helvetica Neue, Arial, sans-serif" font-size="18" font-weight="500">Bob</text>

    <rect x="500" y="288" width="200" height="88" fill="#F9F7F4"/>
    <rect x="500" y="288" width="6" height="88" fill="#00A972"/>
    <text x="606" y="322" text-anchor="middle" fill="#90A5B1" font-family="DM Sans, Helvetica Neue, Arial, sans-serif" font-size="12">Company</text>
    <text x="606" y="348" text-anchor="middle" fill="#1B3139" font-family="DM Sans, Helvetica Neue, Arial, sans-serif" font-size="18" font-weight="500">Amazon</text>

    <rect x="80" y="368" width="200" height="88" fill="#F9F7F4"/>
    <rect x="80" y="368" width="6" height="88" fill="#1B5162"/>
    <text x="186" y="402" text-anchor="middle" fill="#90A5B1" font-family="DM Sans, Helvetica Neue, Arial, sans-serif" font-size="12">Product</text>
    <text x="186" y="428" text-anchor="middle" fill="#1B3139" font-family="DM Sans, Helvetica Neue, Arial, sans-serif" font-size="18" font-weight="500">lipstick-1</text>

    <line x1="280" y1="198" x2="500" y2="172" stroke="#C4CCD6" stroke-width="1.6"/>
    <text x="360" y="158" fill="#90A5B1" font-family="DM Mono, ui-monospace, monospace" font-size="11">destined_for</text>
    <line x1="280" y1="228" x2="500" y2="332" stroke="#C4CCD6" stroke-width="1.6"/>
    <text x="330" y="298" fill="#90A5B1" font-family="DM Mono, ui-monospace, monospace" font-size="11">shipped_by</text>
    <line x1="180" y1="256" x2="180" y2="368" stroke="#C4CCD6" stroke-width="1.6"/>
    <text x="196" y="318" fill="#90A5B1" font-family="DM Mono, ui-monospace, monospace" font-size="11">contains</text>
  </g>

  <g>
    <rect x="800" y="148" width="340" height="360" fill="#F9F7F4"/>
    <text x="828" y="186" fill="#90A5B1" font-family="DM Sans, Helvetica Neue, Arial, sans-serif" font-size="12">INFERENCE</text>
    <text x="828" y="226" fill="#1B3139" font-family="DM Sans, Helvetica Neue, Arial, sans-serif" font-size="16">late forecast ? at_risk</text>
    <text x="828" y="254" fill="#BA7B23" font-family="DM Sans, Helvetica Neue, Arial, sans-serif" font-size="14">confidence &lt; 0.8 ? pending HITL</text>
    <text x="828" y="300" fill="#90A5B1" font-family="DM Sans, Helvetica Neue, Arial, sans-serif" font-size="12">RECOMMENDED ACTION</text>
    <text x="828" y="336" fill="#1B3139" font-family="DM Sans, Helvetica Neue, Arial, sans-serif" font-size="16">notify_buyer ? Bob</text>
    <rect x="828" y="380" width="284" height="44" fill="#FF3621"/>
    <text x="970" y="408" text-anchor="middle" fill="#FFFFFF" font-family="DM Sans, Helvetica Neue, Arial, sans-serif" font-size="15" font-weight="500">apply_action</text>
    <text x="828" y="454" fill="#90A5B1" font-family="DM Sans, Helvetica Neue, Arial, sans-serif" font-size="12">Audited. No SQL. No PATCH.</text>
  </g>
</svg>
