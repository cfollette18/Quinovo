ontology:
  api_name: clinic
  display_name: Example clinic
  description: Honesty check that a second domain loads without forking the engine.

object_types:
  - api_name: Patient
    primary_key: id
    title_property: name
    properties:
      - api_name: id
        type: string
      - api_name: name
        type: string
      - api_name: status
        type: string
  - api_name: Bed
    primary_key: id
    title_property: id
    properties:
      - api_name: id
        type: string
      - api_name: status
        type: string

link_types:
  - api_name: occupies
    from_type: Patient
    to_type: Bed
    from_name: bed
    to_name: patient
    cardinality: many_to_one

action_types:
  - api_name: discharge
    description: The only legal way to mark a patient discharged.
    parameters:
      - api_name: patient
        type: object
        object_type: Patient
    edits:
      - parameter: patient
        set:
          status: discharged
