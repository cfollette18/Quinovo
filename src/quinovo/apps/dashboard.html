<div class="page-head">
  <p class="crumbs"><span>Workspace</span><span class="here">Graph</span></p>
  <div class="page-head-row">
    <div>
      <h1>Graph</h1>
      <p class="meta" id="graph-meta">Each map is one topic, with subtopics nested inside.</p>
    </div>
    <div class="page-actions">
      <button type="button" class="btn btn-ghost" id="extend" aria-pressed="false">Extend graph</button>
    </div>
  </div>
  <nav class="tabs">
    <a class="tab" href="/twin">Twin</a>
    <a class="tab on" href="/graph">Graph</a>
    <a class="tab" href="/catalog">Catalog</a>
    <a class="tab" href="/inference">Inference</a>
    <a class="tab" href="/sources">Sources</a>
    <a class="tab" href="/audit">Audit</a>
    <a class="tab" href="/train">Train</a>
    <a class="tab" href="/settings">Settings</a>
  </nav>
</div>
<div class="layout" id="layout">
  <div class="graph-wrap" id="graph-wrap">
    <div class="graph-toolbar" id="graph-toolbar">
      <div class="filter-row">
        <span class="filter-label">Topics</span>
        <div class="chips" id="topic-filters">
          <button type="button" class="filter-chip on" data-topic="">All topics</button>
        </div>
      </div>
      <div class="filter-row">
        <span class="filter-label">Kinds</span>
        <div class="chips" id="kind-filters">
          <button type="button" class="filter-chip on" data-type="">All kinds</button>
          <button type="button" class="filter-chip" data-type="">Show all</button>
        </div>
        <label class="filter-link">
          <span>Connections</span>
          <select id="link-filter" aria-label="Filter connections">
            <option value="">All connections</option>
          </select>
        </label>
        <p class="filter-hint">Click a card to read it. A yellow mark means it needs a look.</p>
      </div>
    </div>
    <div class="graph-canvas" id="graph-canvas">
      <div class="graph-empty" id="graph-empty" hidden>
        <div class="empty-state">
          <p class="empty-title" id="graph-empty-title">Nothing on the map yet</p>
          <p class="empty" id="graph-empty-msg">As things appear, they show up here.</p>
          <p class="empty-action"><a class="btn btn-ghost" href="/sources">Add a connection</a></p>
        </div>
      </div>
      <svg id="svg" xmlns="http://www.w3.org/2000/svg"></svg>
    </div>
  </div>
</div>
<dialog id="card-modal" class="card-modal" aria-labelledby="card-modal-title">
  <div class="card-modal-head">
    <button type="button" class="btn btn-ghost" id="card-modal-close">Close</button>
  </div>
  <div id="card-modal-body"></div>
</dialog>
<script>
(() => {
  const svg = document.getElementById("svg");
  const wrap = document.getElementById("graph-wrap");
  const canvas = document.getElementById("graph-canvas");
  const q = document.getElementById("q");
  const modal = document.getElementById("card-modal");
  const modalBody = document.getElementById("card-modal-body");
  const kindFilters = document.getElementById("kind-filters");
  const topicFilters = document.getElementById("topic-filters");
  const linkFilterEl = document.getElementById("link-filter");
  const emptyEl = document.getElementById("graph-empty");
  const CARD_W = 168;
  const CARD_H = 56;
  const COL_GAP = 36;
  const ROW_GAP = 16;
  const TOP = 36;
  const SIDE = 28;
  const CLUSTER_PAD = 22;
  const CLUSTER_GAP = 20;
  const CLUSTER_OVERLAP = 32;
  const MEMBER_COLS = 3;
  const SWATCH = ["#FF3621", "#2272B4", "#00A972", "#1B5162", "#98102A", "#FFAB00", "#1B3139"];
  let graph = { nodes: [], edges: [], pack: "", display_name: "" };
  let ontology = { object_types: [], action_types: [], link_types: [] };
  let facts = [];
  let selected = null;
  let typeFilter = null;
  let topicFocus = null;
  let linkFilter = "";
  let sim = [];
  let clusters = [];
  let tree = { byId: {}, parentOf: {}, childrenOf: {}, topicOf: {}, roots: [], membersOf: {}, unfiled: [], topicIds: [] };
  let dragging = null;
  let dragMoved = false;

  if (q) q.dataset.local = "1";
  const params = new URLSearchParams(location.search);
  if (params.get("q") && q) q.value = params.get("q");
  if (params.get("type")) typeFilter = params.get("type");
  if (params.get("topic")) topicFocus = params.get("topic");

  const tone = (t) => {
    let h = 0;
    for (const c of t) h = (h * 33 + c.charCodeAt(0)) % 2147483647;
    return SWATCH[Math.abs(h) % SWATCH.length];
  };

  function pretty(name) {
    return String(name || "").replace(/[_-]+/g, " ").replace(/\b\w/g, (c) => c.toUpperCase());
  }

  function factLine(pred, value) {
    const label = pretty(pred);
    const raw = String(value ?? "").trim();
    const low = raw.toLowerCase();
    if (["true", "1", "yes"].includes(low)) return label;
    if (["false", "0", "no", ""].includes(low)) {
      const words = String(pred || "").replace(/[_-]+/g, " ");
      return words ? "Not " + words : "Not the case";
    }
    const prettyVal = /[_-]/.test(raw) ? pretty(raw) : raw;
    if (/recommended/.test(String(pred || ""))) return "Suggested: " + prettyVal;
    return label + " — " + prettyVal;
  }

  function clip(s, n) {
    s = String(s ?? "");
    return s.length > n ? s.slice(0, n - 1) + "…" : s;
  }

  function kindList() {
    const fromOnt = (ontology.object_types || []).map((t) => t.api_name);
    const seen = [...new Set(graph.nodes.map((n) => n.type))];
    const extra = seen.filter((t) => !fromOnt.includes(t));
    return [...fromOnt, ...extra];
  }

  function linkTypes() {
    const fromOnt = (ontology.link_types || []).map((t) => t.api_name || t.name).filter(Boolean);
    const seen = [...new Set(graph.edges.map((e) => e.type))];
    const extra = seen.filter((t) => !fromOnt.includes(t));
    return [...fromOnt, ...extra];
  }

  function isContainment(type) {
    return type === "subtopic_of" || /_in_topic$/.test(String(type || ""));
  }

  function topicRef(raw) {
    const text = String(raw || "");
    if (!text) return "";
    return text.startsWith("Topic:") ? text : "Topic:" + text;
  }

  function neighborIds(primaryType) {
    const ids = new Set();
    const primaries = new Set(
      graph.nodes.filter((n) => n.type === primaryType).map((n) => n.id)
    );
    for (const e of graph.edges) {
      if (linkFilter && e.type !== linkFilter) continue;
      if (primaries.has(e.from)) ids.add(e.to);
      if (primaries.has(e.to)) ids.add(e.from);
    }
    return ids;
  }

  function visibleNodes() {
    const needle = (q ? q.value : "").trim().toLowerCase();
    const hops = typeFilter ? neighborIds(typeFilter) : null;
    const focus = topicRef(topicFocus);
    return graph.nodes.filter((n) => {
      if (typeFilter && n.type !== typeFilter && !(hops && hops.has(n.id))) return false;
      if (linkFilter && !typeFilter) {
        const onEdge = graph.edges.some(
          (e) => e.type === linkFilter && (e.from === n.id || e.to === n.id)
        );
        if (!onEdge) return false;
      }
      if (focus) {
        const home = tree.topicOf[n.id];
        if (n.id !== focus && home !== focus && !underTopic(n.id, focus) && !underTopic(home, focus)) {
          return false;
        }
      }
      if (!needle) return true;
      return `${n.type} ${n.pk} ${n.label}`.toLowerCase().includes(needle);
    });
  }

  function underTopic(nodeId, ancestorId) {
    let cur = nodeId;
    const seen = new Set();
    while (cur && !seen.has(cur)) {
      if (cur === ancestorId) return true;
      seen.add(cur);
      cur = tree.parentOf[cur] || tree.topicOf[cur];
      if (cur === nodeId) break;
    }
    return false;
  }

  function syncUrl() {
    const p = new URLSearchParams();
    if (typeFilter) p.set("type", typeFilter);
    if (topicFocus) p.set("topic", topicFocus.replace(/^Topic:/, ""));
    if (q && q.value.trim()) p.set("q", q.value.trim());
    const qs = p.toString();
    history.replaceState(null, "", qs ? ("/graph?" + qs) : "/graph");
  }

  function buildTree() {
    const byId = Object.fromEntries(graph.nodes.map((n) => [n.id, n]));
    const parentOf = {};
    const childrenOf = {};
    const topicsFor = {};
    for (const e of graph.edges) {
      if (e.type === "subtopic_of") {
        parentOf[e.from] = e.to;
        (childrenOf[e.to] ||= []).push(e.from);
      } else if (/_in_topic$/.test(e.type)) {
        (topicsFor[e.from] ||= []).push(e.to);
      }
    }
    const depthOf = (tid) => {
      let d = 0;
      let cur = tid;
      const seen = new Set();
      while (parentOf[cur] && !seen.has(cur)) {
        seen.add(cur);
        cur = parentOf[cur];
        d += 1;
      }
      return d;
    };
    const topicOf = {};
    for (const n of graph.nodes) {
      if (n.type === "Topic") topicOf[n.id] = n.id;
    }
    for (const [nid, tids] of Object.entries(topicsFor)) {
      const ranked = [...tids].sort((a, b) => depthOf(b) - depthOf(a));
      topicOf[nid] = ranked[0];
    }
    const membersOf = {};
    const unfiled = [];
    for (const n of graph.nodes) {
      if (n.type === "Topic") continue;
      const home = topicOf[n.id];
      if (home && byId[home]) (membersOf[home] ||= []).push(n);
      else unfiled.push(n);
    }
    const topicIds = graph.nodes.filter((n) => n.type === "Topic").map((n) => n.id);
    const roots = topicIds.filter((id) => !parentOf[id] || !byId[parentOf[id]]);
    return { byId, parentOf, childrenOf, topicOf, roots, membersOf, unfiled, topicIds };
  }

  function topicPath(tid) {
    const names = [];
    let cur = tid;
    const seen = new Set();
    while (cur && tree.byId[cur] && !seen.has(cur)) {
      seen.add(cur);
      names.unshift(tree.byId[cur].label || cur);
      cur = tree.parentOf[cur];
    }
    return names;
  }

  function renderFilters() {
    const kinds = kindList();
    const counts = Object.fromEntries(kinds.map((t) => [t, graph.nodes.filter((n) => n.type === t).length]));
    const chips = [
      `<button type="button" class="filter-chip ${typeFilter ? "" : "on"}" data-type="" aria-pressed="${typeFilter ? "false" : "true"}">All kinds</button>`,
    ];
    for (const t of kinds) {
      const on = typeFilter === t ? "on" : "";
      chips.push(
        `<button type="button" class="filter-chip ${on}" data-type="${esc(t)}" aria-pressed="${on ? "true" : "false"}">` +
        `<i style="background:${tone(t)}" aria-hidden="true"></i>${esc(pretty(t))} <span class="mono">${counts[t] || 0}</span></button>`
      );
    }
    chips.push(`<button type="button" class="filter-chip" data-type="" aria-pressed="false">Show all</button>`);
    kindFilters.innerHTML = chips.join("");
    kindFilters.querySelectorAll("[data-type]").forEach((btn) => {
      btn.addEventListener("click", () => {
        typeFilter = btn.dataset.type || null;
        syncUrl();
        renderFilters();
        layout();
        draw();
      });
    });
    const roots = tree.roots || [];
    const focus = topicRef(topicFocus);
    const topicChips = [
      `<button type="button" class="filter-chip ${focus ? "" : "on"}" data-topic="" aria-pressed="${focus ? "false" : "true"}">All topics</button>`,
    ];
    for (const id of roots) {
      const node = tree.byId[id];
      if (!node) continue;
      const on = focus === id ? "on" : "";
      const slug = id.replace(/^Topic:/, "");
      topicChips.push(
        `<button type="button" class="filter-chip ${on}" data-topic="${esc(slug)}" aria-pressed="${on ? "true" : "false"}">${esc(node.label || pretty(slug))}</button>`
      );
    }
    topicFilters.innerHTML = topicChips.join("");
    topicFilters.querySelectorAll("[data-topic]").forEach((btn) => {
      btn.addEventListener("click", () => {
        topicFocus = btn.dataset.topic || null;
        syncUrl();
        renderFilters();
        layout();
        draw();
      });
    });
    const current = linkFilterEl.value;
    linkFilterEl.replaceChildren();
    const all = document.createElement("option");
    all.value = "";
    all.textContent = "All connections";
    linkFilterEl.appendChild(all);
    for (const t of linkTypes()) {
      const opt = document.createElement("option");
      opt.value = t;
      opt.textContent = pretty(t);
      linkFilterEl.appendChild(opt);
    }
    linkFilterEl.value = [...linkFilterEl.options].some((o) => o.value === current) ? current : "";
    linkFilter = linkFilterEl.value;
  }

  function normalizeGraph(g) {
    const nodes = (g.nodes || []).map((n) => ({
      ...n,
      pk: n.pk || String(n.id || "").split(/:(.*)/)[1] || n.id,
    }));
    const raw = Array.isArray(g.edges) ? g.edges : (g.links || []);
    const edges = raw.map((e) => ({
      type: e.type || e.link_type || "",
      from: e.from || e.from_id || "",
      to: e.to || e.to_id || "",
    }));
    return { ...g, nodes, edges };
  }

  async function load() {
    const [g, o, f] = await Promise.all([
      fetch("/graph.json").then((r) => r.json()),
      fetch("/ontology").then((r) => r.json()),
      fetch("/inference/facts").then((r) => r.json()).catch(() => ({ facts: [] })),
    ]);
    graph = normalizeGraph(g);
    ontology = o;
    facts = f.facts || [];
    tree = buildTree();
    const name = graph.display_name || graph.pack || "World";
    const packEl = document.getElementById("pack-name");
    if (packEl) packEl.textContent = name;
    document.title = `Quinovo — ${name}`;
    const topicCount = tree.topicIds.length;
    document.getElementById("graph-meta").textContent = topicCount
      ? `${topicCount} topics · ${graph.nodes.length} things · ${graph.edges.length} connections`
      : `${graph.nodes.length} things, ${graph.edges.length} connections`;
    renderFilters();
    layout();
    draw();
    if (selected) show(selected, { silent: true });
  }

  function hasVisibleContent(tid, shownIds) {
    if (shownIds.has(tid)) return true;
    if ((tree.membersOf[tid] || []).some((n) => shownIds.has(n.id))) return true;
    return (tree.childrenOf[tid] || []).some((cid) => hasVisibleContent(cid, shownIds));
  }

  function measureTopic(tid, shownIds) {
    const kids = (tree.childrenOf[tid] || []).filter((id) => hasVisibleContent(id, shownIds));
    const members = (tree.membersOf[tid] || []).filter((n) => shownIds.has(n.id));
    const childMs = kids.map((id) => measureTopic(id, shownIds));
    const cols = Math.max(1, Math.min(MEMBER_COLS, members.length || 1));
    const memberW = members.length ? cols * (CARD_W + ROW_GAP) - ROW_GAP : 0;
    const memberRows = members.length ? Math.ceil(members.length / cols) : 0;
    const memberH = memberRows ? memberRows * (CARD_H + ROW_GAP) - ROW_GAP : 0;
    const kidsW = childMs.reduce((sum, child) => sum + child.w, 0)
      + Math.max(0, childMs.length - 1) * (CLUSTER_GAP - CLUSTER_OVERLAP);
    const kidsH = childMs.length ? Math.max(...childMs.map((child) => child.h)) : 0;
    const headerW = CARD_W + (memberW ? CLUSTER_GAP + memberW : 0);
    const innerW = Math.max(headerW, kidsW, CARD_W);
    const headerBlock = Math.max(CARD_H, memberH);
    const kidsBlock = kidsH ? CLUSTER_GAP - CLUSTER_OVERLAP + kidsH : 0;
    return {
      tid,
      w: innerW + CLUSTER_PAD * 2,
      h: CLUSTER_PAD + headerBlock + kidsBlock + CLUSTER_PAD,
      members,
      childMs,
      headerBlock,
    };
  }

  function placeTopic(m, x, y, depth, shownIds) {
    clusters.push({
      id: m.tid,
      x,
      y,
      w: m.w,
      h: m.h,
      depth,
      label: (tree.byId[m.tid] && tree.byId[m.tid].label) || m.tid,
    });
    const topicNode = tree.byId[m.tid];
    const innerLeft = x + CLUSTER_PAD;
    const innerTop = y + CLUSTER_PAD;
    const cardX = m.members.length || m.childMs.length
      ? innerLeft + CARD_W / 2
      : x + m.w / 2;
    const cardY = innerTop + CARD_H / 2;
    if (topicNode && shownIds.has(topicNode.id)) {
      sim.push({ ...topicNode, x: cardX, y: cardY, neighbor: false, cluster: m.tid });
    }
    const memOriginX = innerLeft + CARD_W + CLUSTER_GAP;
    const cols = Math.max(1, Math.min(MEMBER_COLS, m.members.length || 1));
    m.members.forEach((n, i) => {
      const col = i % cols;
      const row = Math.floor(i / cols);
      sim.push({
        ...n,
        x: memOriginX + col * (CARD_W + ROW_GAP) + CARD_W / 2,
        y: innerTop + row * (CARD_H + ROW_GAP) + CARD_H / 2,
        neighbor: !!(typeFilter && n.type !== typeFilter),
        cluster: m.tid,
      });
    });
    let childX = innerLeft;
    const childY = innerTop + m.headerBlock + CLUSTER_GAP - CLUSTER_OVERLAP;
    for (const child of m.childMs) {
      placeTopic(child, childX, childY, depth + 1, shownIds);
      childX += child.w + CLUSTER_GAP - CLUSTER_OVERLAP;
    }
  }

  function layoutLanes(shown) {
    clusters = [];
    const shownTypes = [];
    for (const t of kindList()) {
      if (shown.some((n) => n.type === t)) shownTypes.push(t);
    }
    const { width } = canvas.getBoundingClientRect();
    const colCount = Math.max(shownTypes.length, 1);
    const colW = Math.max(CARD_W + COL_GAP, (Math.max(width, 480) - SIDE * 2) / colCount);
    const byType = Object.fromEntries(shownTypes.map((t) => [t, shown.filter((n) => n.type === t)]));
    const tallest = Math.max(1, ...shownTypes.map((t) => (byType[t] || []).length));
    const neededH = TOP + 24 + tallest * (CARD_H + ROW_GAP) + 32;
    const neededW = SIDE * 2 + colCount * colW;
    svg.setAttribute("width", Math.max(width, neededW));
    svg.setAttribute("height", Math.max(canvas.clientHeight || 320, neededH));
    sim = shown.map((n) => {
      const col = shownTypes.indexOf(n.type);
      const among = byType[n.type] || [];
      const k = among.findIndex((x) => x.id === n.id);
      return {
        ...n,
        x: SIDE + col * colW + colW / 2,
        y: TOP + 28 + k * (CARD_H + ROW_GAP) + CARD_H / 2,
        neighbor: !!(typeFilter && n.type !== typeFilter),
      };
    });
  }

  function layoutTopics(shown) {
    const shownIds = new Set(shown.map((n) => n.id));
    clusters = [];
    sim = [];
    const focus = topicRef(topicFocus);
    let roots = (tree.roots || []).filter((id) => hasVisibleContent(id, shownIds));
    if (focus && tree.byId[focus]) roots = [focus];
    const rootMs = roots.map((id) => measureTopic(id, shownIds));
    const unfiled = (tree.unfiled || []).filter((n) => shownIds.has(n.id));
    let unfiledW = 0;
    let unfiledH = 0;
    if (unfiled.length) {
      const cols = Math.max(1, Math.min(MEMBER_COLS, unfiled.length));
      const rows = Math.ceil(unfiled.length / cols);
      unfiledW = CLUSTER_PAD * 2 + cols * (CARD_W + ROW_GAP) - ROW_GAP;
      unfiledH = CLUSTER_PAD * 2 + 24 + rows * (CARD_H + ROW_GAP) - ROW_GAP;
    }
    const rootsW = rootMs.reduce((sum, m) => sum + m.w, 0)
      + Math.max(0, rootMs.length - 1) * CLUSTER_GAP;
    const totalW = rootsW + (unfiled.length ? CLUSTER_GAP + unfiledW : 0);
    const totalH = Math.max(
      1,
      ...rootMs.map((m) => m.h),
      unfiledH,
    );
    const { width, height } = canvas.getBoundingClientRect();
    const neededW = Math.max(width, totalW + SIDE * 2);
    const neededH = Math.max(height || 320, totalH + TOP * 2);
    svg.setAttribute("width", neededW);
    svg.setAttribute("height", neededH);
    let x = Math.max(SIDE, (neededW - totalW) / 2);
    const y = Math.max(TOP, (neededH - totalH) / 2);
    for (const m of rootMs) {
      placeTopic(m, x, y, 0, shownIds);
      x += m.w + CLUSTER_GAP;
    }
    if (unfiled.length) {
      clusters.push({ id: "__unfiled", x, y, w: unfiledW, h: unfiledH, depth: 0, label: "Unfiled" });
      const cols = Math.max(1, Math.min(MEMBER_COLS, unfiled.length));
      unfiled.forEach((n, i) => {
        const col = i % cols;
        const row = Math.floor(i / cols);
        sim.push({
          ...n,
          x: x + CLUSTER_PAD + col * (CARD_W + ROW_GAP) + CARD_W / 2,
          y: y + CLUSTER_PAD + 24 + row * (CARD_H + ROW_GAP) + CARD_H / 2,
          neighbor: !!(typeFilter && n.type !== typeFilter),
          cluster: "__unfiled",
        });
      });
    }
  }

  function layout() {
    const shown = visibleNodes();
    const hasTopics = graph.nodes.some((n) => n.type === "Topic");
    if (hasTopics) layoutTopics(shown);
    else layoutLanes(shown);
  }

  function nodeFacts(id) {
    const [type, pk] = id.split(/:(.*)/).filter(Boolean);
    return facts.filter((f) => f.object_type === type && (f.object_id === pk));
  }

  function draw() {
    const shown = visibleNodes();
    const shownIds = new Set(shown.map((n) => n.id));
    const pos = Object.fromEntries(sim.map((n) => [n.id, n]));
    const ns = "http://www.w3.org/2000/svg";
    svg.replaceChildren();
    const emptyTitle = document.getElementById("graph-empty-title");
    const emptyMsg = document.getElementById("graph-empty-msg");
    if (graph.nodes.length === 0) {
      emptyEl.hidden = false;
      if (emptyTitle) emptyTitle.textContent = "Nothing on the map yet";
      if (emptyMsg) emptyMsg.textContent = "As things appear, they show up here.";
    } else if (shown.length === 0) {
      emptyEl.hidden = false;
      if (emptyTitle) emptyTitle.textContent = typeFilter ? "Nothing of this kind yet" : "No matches";
      if (emptyMsg) emptyMsg.textContent = "Clear the filter or search to see more.";
    } else {
      emptyEl.hidden = true;
    }
    const useClusters = clusters.length > 0;
    if (!useClusters) {
      const shownTypes = [];
      for (const t of kindList()) {
        if (shown.some((n) => n.type === t)) shownTypes.push(t);
      }
      const { width } = canvas.getBoundingClientRect();
      const colCount = Math.max(shownTypes.length, 1);
      const colW = Math.max(CARD_W + COL_GAP, (Math.max(width, 480) - SIDE * 2) / colCount);
      shownTypes.forEach((t, i) => {
        const x = SIDE + i * colW;
        const band = document.createElementNS(ns, "rect");
        band.setAttribute("class", "lane-band");
        band.setAttribute("x", x);
        band.setAttribute("y", 0);
        band.setAttribute("width", colW);
        band.setAttribute("height", svg.getAttribute("height") || 400);
        svg.appendChild(band);
        const rule = document.createElementNS(ns, "line");
        rule.setAttribute("x1", x);
        rule.setAttribute("x2", x);
        rule.setAttribute("y1", 8);
        rule.setAttribute("y2", svg.getAttribute("height") || 400);
        rule.setAttribute("class", "lane-rule");
        svg.appendChild(rule);
        const heading = document.createElementNS(ns, "text");
        heading.setAttribute("class", "lane-label");
        heading.setAttribute("x", x + 12);
        heading.setAttribute("y", 22);
        heading.textContent = pretty(t);
        svg.appendChild(heading);
      });
    } else {
      const selectedCluster = (sim.find((n) => n.id === selected) || {}).cluster;
      [...clusters].sort((a, b) => a.depth - b.depth).forEach((c) => {
        const rect = document.createElementNS(ns, "rect");
        const on = selectedCluster && (c.id === selectedCluster || underTopic(selectedCluster, c.id));
        rect.setAttribute("class", "topic-cluster depth-" + c.depth + (on ? " on" : ""));
        rect.setAttribute("x", c.x);
        rect.setAttribute("y", c.y);
        rect.setAttribute("width", c.w);
        rect.setAttribute("height", c.h);
        rect.setAttribute("rx", "10");
        svg.appendChild(rect);
        if (c.id === "__unfiled") {
          const heading = document.createElementNS(ns, "text");
          heading.setAttribute("class", "cluster-label");
          heading.setAttribute("x", c.x + CLUSTER_PAD);
          heading.setAttribute("y", c.y + 18);
          heading.textContent = "Unfiled";
          svg.appendChild(heading);
        }
      });
    }
    for (const e of graph.edges) {
      if (linkFilter && e.type !== linkFilter) continue;
      if (useClusters && isContainment(e.type)) continue;
      if (!shownIds.has(e.from) || !shownIds.has(e.to)) continue;
      const a = pos[e.from], b = pos[e.to];
      if (!a || !b) continue;
      const group = document.createElementNS(ns, "g");
      const hot = selected && (e.from === selected || e.to === selected);
      group.setAttribute("class", "edge-group" + (hot ? " on" : ""));
      const line = document.createElementNS(ns, "line");
      line.setAttribute("x1", a.x); line.setAttribute("y1", a.y);
      line.setAttribute("x2", b.x); line.setAttribute("y2", b.y);
      line.setAttribute("class", "edge");
      group.appendChild(line);
      const label = document.createElementNS(ns, "text");
      label.setAttribute("class", "edge-label");
      label.setAttribute("x", (a.x + b.x) / 2);
      label.setAttribute("y", (a.y + b.y) / 2 - 8);
      label.setAttribute("text-anchor", "middle");
      label.textContent = pretty(e.type);
      group.appendChild(label);
      svg.appendChild(group);
    }
    for (const n of sim) {
      if (!shownIds.has(n.id)) continue;
      const g = document.createElementNS(ns, "g");
      const cls = ["node"];
      if (selected === n.id) cls.push("selected");
      if (n.neighbor) cls.push("neighbor");
      g.setAttribute("class", cls.join(" "));
      g.setAttribute("tabindex", "0");
      g.setAttribute("role", "button");
      g.setAttribute("aria-label", pretty(n.type) + " " + n.label);
      g.dataset.id = n.id;
      const x = n.x - CARD_W / 2;
      const y = n.y - CARD_H / 2;
      const card = document.createElementNS(ns, "rect");
      card.setAttribute("class", "card");
      card.setAttribute("x", x); card.setAttribute("y", y);
      card.setAttribute("width", CARD_W); card.setAttribute("height", CARD_H);
      card.setAttribute("rx", "2");
      const swatch = document.createElementNS(ns, "rect");
      swatch.setAttribute("class", "swatch");
      swatch.setAttribute("x", x); swatch.setAttribute("y", y);
      swatch.setAttribute("width", 5); swatch.setAttribute("height", CARD_H);
      swatch.setAttribute("fill", tone(n.type));
      const kind = document.createElementNS(ns, "text");
      kind.setAttribute("class", "kind");
      kind.setAttribute("x", x + 16); kind.setAttribute("y", y + 20);
      kind.textContent = pretty(n.type);
      const label = document.createElementNS(ns, "text");
      label.setAttribute("class", "label");
      label.setAttribute("x", x + 16); label.setAttribute("y", y + 40);
      label.textContent = clip(n.label, 20);
      const pending = nodeFacts(n.id).some((f) => f.status === "pending");
      g.appendChild(card); g.appendChild(swatch); g.appendChild(kind); g.appendChild(label);
      if (pending) {
        const dot = document.createElementNS(ns, "circle");
        dot.setAttribute("cx", x + CARD_W - 12);
        dot.setAttribute("cy", y + 12);
        dot.setAttribute("r", 4);
        dot.setAttribute("fill", "#FFAB00");
        dot.setAttribute("aria-label", "Needs a look");
        const title = document.createElementNS(ns, "title");
        title.textContent = "Needs a look";
        g.appendChild(title);
        g.appendChild(dot);
      }
      g.addEventListener("pointerdown", (ev) => startDrag(ev, n));
      g.addEventListener("click", (ev) => {
        ev.stopPropagation();
        if (dragMoved) return;
        pick(n.id);
      });
      g.addEventListener("keydown", (ev) => {
        if (ev.key === "Enter" || ev.key === " ") {
          ev.preventDefault();
          pick(n.id);
        }
      });
      svg.appendChild(g);
    }
  }

  function startDrag(ev, n) {
    dragging = n;
    dragMoved = false;
    svg.setPointerCapture(ev.pointerId);
  }
  svg.addEventListener("pointermove", (ev) => {
    if (!dragging) return;
    const r = svg.getBoundingClientRect();
    const nx = ev.clientX - r.left;
    const ny = ev.clientY - r.top;
    if (Math.hypot(nx - dragging.x, ny - dragging.y) > 4) dragMoved = true;
    dragging.x = nx;
    dragging.y = ny;
    draw();
  });
  svg.addEventListener("pointerup", () => { dragging = null; });

  async function pick(id) {
    selected = id;
    draw();
    show(id);
  }

  function storyFor(obj, id) {
    const kind = pretty(obj.type).toLowerCase();
    if (obj.type === "Topic") {
      const parent = tree.parentOf[id];
      const kids = (tree.childrenOf[id] || []).map((cid) => (tree.byId[cid] || {}).label || cid);
      const held = (tree.membersOf[id] || []).length;
      const bits = [`This topic holds ${held} ${held === 1 ? "thing" : "things"}`];
      if (parent && tree.byId[parent]) bits.push(`inside ${tree.byId[parent].label}`);
      if (kids.length) bits.push(`with subtopics ${kids.join(", ")}`);
      return bits.join(", ") + ".";
    }
    const home = tree.topicOf[id];
    const path = home ? topicPath(home) : [];
    if (path.length) return `This is a ${kind} in ${path.join(" · ")}.`;
    return `This is a ${kind}.`;
  }

  async function show(id, opts = {}) {
    const [type, pk] = id.split(/:(.*)/).filter(Boolean);
    const obj = await fetch(`/objects/${encodeURIComponent(type)}/${encodeURIComponent(pk)}`).then((r) => r.json());
    const props = Object.entries(obj.properties || {}).map(([k, v]) =>
      `<tr><th>${esc(pretty(k))}</th><td>${esc(v)}</td></tr>`
    ).join("");
    const noticed = (obj.facts || obj.inferred || []).map((f) =>
      `<li class="${f.status}">${esc(factLine(f.predicate, f.value))}</li>`
    ).join("");
    const connections = graph.edges
      .filter((e) => e.from === id || e.to === id)
      .map((e) => {
        const otherId = e.from === id ? e.to : e.from;
        const other = graph.nodes.find((n) => n.id === otherId);
        const label = other ? other.label : (otherId.split(/:(.*)/)[1] || otherId);
        const hrefType = other ? other.type : otherId.split(":")[0];
        const hrefPk = other ? other.pk : (otherId.split(/:(.*)/)[1] || "");
        return `<li>${esc(pretty(e.type))} → <a href="/view/${encodeURIComponent(hrefType)}/${encodeURIComponent(hrefPk)}">${esc(label)}</a></li>`;
      }).join("");
    const actions = (ontology.action_types || [])
      .filter((a) => {
        const p = (a.parameters || [])[0];
        return !p || p.object_type === obj.type;
      })
      .map((a) =>
        `<button type="button" class="btn btn-primary act" data-action="${esc(a.api_name)}">${esc(pretty(a.api_name))}</button>`
      ).join(" ");
    const title = (obj.properties && (obj.properties.name || obj.properties.title || obj.properties.label)) || obj.id;
    modalBody.innerHTML = `
      <p class="kicker">${esc(pretty(obj.type))}</p>
      <h2 id="card-modal-title">${esc(title)}</h2>
      <p class="story">${esc(storyFor(obj, id))}</p>
      <h3>About this</h3>
      <table class="kv">${props || ""}</table>
      ${props ? "" : "<p class='empty'>Details show up here as this is filled in.</p>"}
      <h3>Connections</h3>
      <ul class="facts">${connections || "<li class='empty'>Connections appear as this relates to other things.</li>"}</ul>
      <h3>What Quinovo noticed</h3>
      <ul class="facts">${noticed || "<li class='empty'>When Quinovo notices something, it shows up here.</li>"}</ul>
      <h3>Actions</h3>
      <div class="actions">${actions || "<p class='empty'>No actions for this yet.</p>"}</div>
      <p style="margin-top:16px"><a href="/view/${encodeURIComponent(type)}/${encodeURIComponent(pk)}">Open full page</a></p>
    `;
    modalBody.querySelectorAll(".act").forEach((b) => {
      b.addEventListener("click", () => applyAction(b.dataset.action, obj));
    });
    if (!opts.silent && modal && typeof modal.showModal === "function" && !modal.open) {
      modal.showModal();
    }
  }

  async function applyAction(actionType, obj) {
    const spec = (ontology.action_types || []).find((a) => a.api_name === actionType);
    const param = (spec && spec.parameters && spec.parameters[0]) || {};
    const body = {
      actor: "human",
      parameters: param.api_name
        ? { [param.api_name]: { id: obj.id } }
        : {},
    };
    const res = await fetch(`/actions/${encodeURIComponent(actionType)}`, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(body),
    });
    const data = await res.json();
    if (!res.ok) {
      modalBody.insertAdjacentHTML("beforeend", `<p class="notice err">${esc(data.detail || res.status)}</p>`);
      return;
    }
    modalBody.insertAdjacentHTML("beforeend", `<p class="notice">Done: ${esc(pretty(actionType))}</p>`);
    await load();
    if (selected) show(selected, { silent: true });
  }

  function esc(v) {
    return String(v ?? "").replace(/[&<>"']/g, (c) => (
      { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]
    ));
  }

  document.getElementById("card-modal-close").addEventListener("click", () => {
    if (modal.open) modal.close();
  });
  modal.addEventListener("click", (ev) => {
    if (ev.target === modal && modal.open) modal.close();
  });

  if (q) q.addEventListener("input", () => {
    syncUrl();
    layout();
    draw();
    const hits = visibleNodes();
    if (hits.length === 1) pick(hits[0].id);
  });
  if (q) q.addEventListener("keydown", (ev) => {
    if (ev.key !== "Enter") return;
    const hits = visibleNodes();
    if (hits[0]) pick(hits[0].id);
  });
  linkFilterEl.addEventListener("change", () => {
    linkFilter = linkFilterEl.value;
    layout();
    draw();
  });
  document.getElementById("extend").addEventListener("click", () => {
    const on = wrap.classList.toggle("extended");
    const btn = document.getElementById("extend");
    btn.textContent = on ? "Exit graph" : "Extend graph";
    btn.setAttribute("aria-pressed", on ? "true" : "false");
    if (on && wrap.requestFullscreen) wrap.requestFullscreen().catch(() => {});
    else if (document.fullscreenElement) document.exitFullscreen().catch(() => {});
    requestAnimationFrame(() => { layout(); draw(); });
  });
  document.addEventListener("fullscreenchange", () => {
    if (!document.fullscreenElement) {
      wrap.classList.remove("extended");
      const btn = document.getElementById("extend");
      btn.textContent = "Extend graph";
      btn.setAttribute("aria-pressed", "false");
    }
    requestAnimationFrame(() => { layout(); draw(); });
  });
  window.addEventListener("resize", () => { layout(); draw(); });
  load().catch((err) => {
    emptyEl.hidden = false;
    const emptyTitle = document.getElementById("graph-empty-title");
    const emptyMsg = document.getElementById("graph-empty-msg");
    if (emptyTitle) emptyTitle.textContent = "Could not load the map";
    if (emptyMsg) emptyMsg.textContent = String(err);
  });
})();
</script>
