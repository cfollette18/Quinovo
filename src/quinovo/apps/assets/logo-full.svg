<?xml version="1.0" encoding="UTF-8"?>
<!-- Quinovo full logo: mark + lowercase "quinovo" wordmark in DM Sans.
     The page loads DM Sans via Google Fonts, so the text renders in-browser. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 220 64" width="220" height="64" role="img" aria-label="Quinovo">
  <title>Quinovo</title>
  <!-- Mark -->
  <g>
    <path d="M32 14 L50 32 L32 50 L14 32 Z" fill="none" stroke="#1B3139" stroke-width="3.5" stroke-linejoin="miter"/>
    <rect x="27" y="9"  width="10" height="10" fill="#FF3621"/>
    <rect x="45" y="27" width="10" height="10" fill="#1B3139"/>
    <rect x="27" y="45" width="10" height="10" fill="#1B3139"/>
    <rect x="9"  y="27" width="10" height="10" fill="#1B3139"/>
    <path d="M40 40 L56 56" fill="none" stroke="#1B3139" stroke-width="4" stroke-linecap="square"/>
  </g>
  <!-- Wordmark -->
  <text x="74" y="42" font-family="'DM Sans','Helvetica Neue',Arial,sans-serif"
        font-size="30" font-weight="700" letter-spacing="-0.5" fill="#1B3139">quinovo</text>
